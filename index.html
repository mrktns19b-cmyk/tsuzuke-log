<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="つづけログ">
  <meta name="description" content="1タップで今日の継続を記録して、続いた日を見える化するアプリ">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>つづけログ</title>
</head>
<body>
  <header class="top">
    <h1 id="title">今日</h1>
    <p id="subtitle"></p>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="メニュー">
    <button data-tab="today"><span class="ti">✅</span><span>今日</span></button>
    <button data-tab="records"><span class="ti">📅</span><span>記録</span></button>
    <button data-tab="settings"><span class="ti">⚙️</span><span>設定</span></button>
  </nav>

  <div id="sheet-bg" class="sheet-bg" hidden></div>
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
